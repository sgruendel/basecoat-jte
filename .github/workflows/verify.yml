name: Verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress -pl basecoat-jte clean verify
      - if: matrix.java == '21'
        run: ./mvnw --batch-mode --no-transfer-progress -pl basecoat-jte -Prelease -Dgpg.skip=true package

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: npm ci
      - run: npm test
      - run: npm run sync-version -- --check
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - run: npm run build
